<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout Canceled — The Copper Swan</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/assets/img/logo-swan.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap nav">
      <a class="brand" href="/">
        <img class="mark" src="/assets/img/logo-swan.svg" alt="" />
        <span class="name">The Copper <b>Swan</b></span>
      </a>
    </div>
  </header>

  <main class="status-page">
    <div class="status-card cancel">
      <div class="badge">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </div>
      <h1>Checkout canceled</h1>
      <p>
        No charge was made. Your cart is saved — whenever you're ready, pick up right where you left off.
      </p>
      <div class="actions">
        <a href="/#shop" class="btn btn-primary">Return to Cart</a>
        <a href="/" class="btn btn-ghost">Keep Browsing</a>
      </div>
    </div>
  </main>
</body>
</html>
