[build]
  publish = "public"
  command = "npm run build"

# Copper Swan uses client-side routes. This fallback keeps every route
# refreshable on Netlify without changing the existing domain configuration.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"
